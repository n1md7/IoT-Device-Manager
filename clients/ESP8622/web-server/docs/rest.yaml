openapi: 3.0.0
info:
  title: ESP IoT Device Manager API
  description: >-
    REST API exposed by the on-device, Express-like web server running on an
    ESP8266 / ESP32 (Moddable SDK, XS runtime).


    The server manages **switches** (digital output pins driving relays/LEDs)
    and **schedules** (time windows that automatically drive a switch on/off).
    All endpoints are mounted under the `/api` prefix and respond with JSON.


    ## Conventions

    - **Base path:** every route is prefixed with `/api`.

    - **Identifiers in the query string:** the router has no dynamic URL params,
      so resource ids are passed via the query string (e.g. `?pin=3`, `?id=1`).

    - **Errors:** any validation or domain failure returns the matching `4xx`
      status with a body of `{ "message": "<reason>" }`.

    - **Pins:** only digital pins `1`–`8` are accepted as control pins.

    - **Control signal:** `0` (LOW) or `1` (HIGH); some relays are active-low.
  version: 1.0.0
tags:
  - name: Switches
    description: >-
      Manage digital output switches and drive them manually. A switch maps a
      digital pin to an on/off control signal.
  - name: Scheduler
    description: >-
      Manage schedules. A schedule turns a switch on within a daily time window
      on the selected weekdays.
  - name: Device
    description: Read-only device identity and clock.
servers:
  - url: http://localhost/api
    description: Local development server
  - url: http://192.168.1.2/api
    description: Device on the home network
paths:
  /switches:
    get:
      tags:
        - Switches
      summary: List switches
      description: Returns all configured switches and their current control signal.
      responses:
        '200':
          description: List of switches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Switch'
    post:
      tags:
        - Switches
      summary: Create a switch
      description: >-
        Registers a switch on a digital pin with an initial control signal.
        The pin must be an allowed pin (`1`–`8`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digitalPin, control, name]
              properties:
                digitalPin:
                  type: integer
                  minimum: 1
                  maximum: 8
                  example: 3
                  description: Digital pin to control.
                control:
                  $ref: '#/components/schemas/Control'
                name:
                  type: string
                  minLength: 2
                  maxLength: 16
                  description: Human-friendly switch name (2–16 chars).
                  example: Garden Pump
      responses:
        '201':
          description: Switch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switch'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - Switches
      summary: Update a switch
      description: >-
        Updates the control signal and name of an existing switch, selected by
        pin. Both `control` and `name` are required.
      parameters:
        - $ref: '#/components/parameters/PinQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [control, name]
              properties:
                control:
                  $ref: '#/components/schemas/Control'
                name:
                  type: string
                  minLength: 2
                  maxLength: 16
                  description: Human-friendly switch name (2–16 chars).
                  example: Garden Pump
      responses:
        '202':
          description: Switch updated
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags:
        - Switches
      summary: Delete a switch
      description: Removes a switch, selected by pin.
      parameters:
        - $ref: '#/components/parameters/PinQuery'
      responses:
        '204':
          description: Switch deleted
        '400':
          $ref: '#/components/responses/BadRequest'
  /switches/control:
    post:
      tags:
        - Switches
      summary: Manually drive a switch
      description: >-
        Starts or stops a switch immediately.


        - `action: "Start"` requires `stopAt` — an epoch timestamp (ms) in the
          future (minimum ~10s ahead). The server arms a one-shot timer and
          automatically stops the switch at `stopAt` (reported as `stopsAt` on
          the switch).

        - `action: "Stop"` stops the switch right away and cancels any pending
          auto-off; `stopAt` is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digitalPin, action]
              properties:
                digitalPin:
                  type: integer
                  minimum: 1
                  maximum: 8
                  example: 3
                action:
                  type: string
                  enum: [Start, Stop]
                  example: Start
                stopAt:
                  type: integer
                  format: int64
                  description: >-
                    Epoch timestamp in milliseconds. Required when `action` is
                    `Start`; must be in the future (min ~10s ahead).
                  example: 1740858186087
      responses:
        '200':
          description: Action applied successfully
        '400':
          $ref: '#/components/responses/BadRequest'
  /schedules:
    get:
      tags:
        - Scheduler
      summary: List schedules
      description: Returns all configured schedules.
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
    post:
      tags:
        - Scheduler
      summary: Create a schedule
      description: >-
        Creates a schedule that drives a switch within a daily `[startTime,
        endTime)` window on the enabled weekdays. `controlPin` must reference an
        already-enabled switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      tags:
        - Scheduler
      summary: Update a schedule
      description: >-
        Partially updates a schedule, selected by id. Every field is optional;
        only the fields provided are changed. If `controlPin` is provided it
        must reference an enabled switch.
      parameters:
        - $ref: '#/components/parameters/IdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleUpdate'
      responses:
        '202':
          description: Schedule updated
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags:
        - Scheduler
      summary: Delete a schedule
      description: Removes a schedule, selected by id.
      parameters:
        - $ref: '#/components/parameters/IdQuery'
      responses:
        '204':
          description: Schedule deleted
        '400':
          $ref: '#/components/responses/BadRequest'
  /device:
    get:
      tags:
        - Device
      summary: Device identity and clock
      description: >-
        Returns the device's build-time identity (set via `mcconfig` /
        `manifest.json`) plus its current time. The UI uses `timestamp` to
        anchor its clock to the device.
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
components:
  parameters:
    PinQuery:
      name: pin
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 8
      description: Digital pin of the switch.
      example: 3
    IdQuery:
      name: id
      in: query
      required: true
      schema:
        type: integer
      description: Numeric id of the schedule.
      example: 1
  responses:
    BadRequest:
      description: Invalid request (bad body, bad query, or a violated domain rule)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Control:
      type: integer
      enum: [0, 1]
      description: Control signal — `0` (LOW) or `1` (HIGH). Some relays are active-low.
      example: 1
    Error:
      type: object
      properties:
        message:
          type: string
          example: Invalid digitalPin
    Device:
      type: object
      description: Build-time device identity plus the current device clock.
      properties:
        name:
          type: string
          example: My Pump
        code:
          type: string
          example: D0001
        version:
          type: string
          example: 1.0.0
        description:
          type: string
          example: Garden water pump controller
        timestamp:
          type: integer
          format: int64
          description: Current device time as an epoch timestamp in milliseconds.
          example: 1740858186087
    Switch:
      type: object
      description: A switch as returned by the API.
      properties:
        pin:
          type: integer
          description: Digital pin number (also the switch identifier).
          example: 3
        name:
          type: string
          minLength: 2
          maxLength: 16
          description: Human-friendly switch name.
          example: Garden Pump
        control:
          $ref: '#/components/schemas/Control'
        active:
          type: boolean
          description: Whether the switch is currently driven on.
          example: true
        stopsAt:
          type: integer
          format: int64
          nullable: true
          description: >-
            Epoch timestamp (ms) at which a manual auto-off will fire, or `null`
            when the switch is off or running under a schedule (no auto-off).
          example: 1740858186087
    TimePayload:
      type: object
      required: [hh, mm, ss]
      description: Time of day as discrete fields (24-hour clock).
      properties:
        hh:
          type: integer
          minimum: 0
          maximum: 23
          example: 13
        mm:
          type: integer
          minimum: 0
          maximum: 59
          example: 30
        ss:
          type: integer
          minimum: 0
          maximum: 59
          example: 0
    WeekPayload:
      type: object
      required: [sun, mon, tue, wed, thu, fri, sat]
      description: >-
        Active-weekday mask, Sunday-first to match JS `Date.getDay()`
        (Sun=0 … Sat=6). Each field is `1` (active) or `0` (inactive).
      properties:
        sun: { type: integer, enum: [0, 1], example: 0 }
        mon: { type: integer, enum: [0, 1], example: 1 }
        tue: { type: integer, enum: [0, 1], example: 1 }
        wed: { type: integer, enum: [0, 1], example: 1 }
        thu: { type: integer, enum: [0, 1], example: 1 }
        fri: { type: integer, enum: [0, 1], example: 1 }
        sat: { type: integer, enum: [0, 1], example: 0 }
    ScheduleInput:
      type: object
      required: [isActive, startTime, endTime, weekdays, controlPin]
      properties:
        isActive:
          type: boolean
          description: Whether the schedule is currently enabled.
          example: true
        startTime:
          $ref: '#/components/schemas/TimePayload'
        endTime:
          $ref: '#/components/schemas/TimePayload'
        weekdays:
          $ref: '#/components/schemas/WeekPayload'
        controlPin:
          type: integer
          minimum: 1
          maximum: 8
          description: Pin of the switch this schedule drives. Must be an enabled switch.
          example: 3
    ScheduleUpdate:
      type: object
      description: Partial schedule update — every field is optional.
      properties:
        isActive:
          type: boolean
          example: false
        startTime:
          $ref: '#/components/schemas/TimePayload'
        endTime:
          $ref: '#/components/schemas/TimePayload'
        weekdays:
          $ref: '#/components/schemas/WeekPayload'
        controlPin:
          type: integer
          minimum: 1
          maximum: 8
          example: 4
    Schedule:
      type: object
      description: >-
        A schedule as returned by the API. Note that times and weekdays are
        serialized as strings, while create/update accept them as objects.
      properties:
        id:
          type: string
          description: Schedule identifier (`SDL:<n>`).
          example: 'SDL:1'
        startTime:
          type: string
          description: Start of the window, `hh:mm:ss`.
          example: '13:30:0'
        endTime:
          type: string
          description: End of the window, `hh:mm:ss`.
          example: '14:0:0'
        weekdays:
          type: string
          description: Active-weekday mask `sun:mon:tue:wed:thu:fri:sat`.
          example: '0:1:1:1:1:1:0'
        isActive:
          type: boolean
          example: true
        digitalPin:
          type: integer
          description: Pin of the switch this schedule drives.
          example: 3
