<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Device · REST API</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e6ecff; background: #0b1020; line-height: 1.5; }
    .wrap { max-width: 480px; padding: 32px 24px; text-align: center; }
    .badge-icon { width: 52px; height: 52px; margin: 0 auto 18px; display: block; }
    h1 { font-size: 26px; margin: 0 0 12px; letter-spacing: -0.02em; }
    .grad { color: #9fb8ff; }
    .lead { color: #93a0c4; font-size: 16px; margin: 0; }
    footer { margin-top: 28px; color: #93a0c4; font-size: 13px; }
    footer a { color: #5b8cff; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .sep { opacity: 0.4; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="badge-icon" src="favicon.ico" alt="Device icon" />
      <h1>This device speaks <span class="grad">REST</span>, not HTML.</h1>
      <p class="lead">
        You've reached the device's API endpoint. The web interface is hosted separately —
        this address only serves the JSON REST API below.
      </p>
    </header>

    <footer>
      <span>IoT Device Manager</span>
      <span class="sep">·</span>
      <a id="open-info" href="/api/info">View raw /api/info</a>
      <span class="sep">·</span>
      <span id="d-host" class="mono"></span>
    </footer>
  </div>
</body>
</html>
